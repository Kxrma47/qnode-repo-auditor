[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnode-repo-auditor"
version = "0.2.0"
description = "Actionable GitHub repository readiness and pull-request risk intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahidul Haque" }]
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=23,<24",
  "PyJWT[crypto]>=2.8,<3",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://qnode-repo-auditor.onrender.com"
Repository = "https://github.com/Kxrma47/qnode-repo-auditor"
Issues = "https://github.com/Kxrma47/qnode-repo-auditor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qnode_auditor*"]

[tool.setuptools.package-data]
qnode_auditor = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
