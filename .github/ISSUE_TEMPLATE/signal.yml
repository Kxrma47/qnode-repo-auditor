name: Signal request
description: Request a precise path-derived review signal using a public example.
title: "signal: "
labels: [enhancement]
body:
  - type: input
    id: public_example
    attributes:
      label: Public example
      description: Link to a public repository or pull request that demonstrates the need.
      placeholder: https://github.com/owner/repository/pull/123
    validations:
      required: true
  - type: textarea
    id: expected_signal
    attributes:
      label: What should QNode report?
      description: Describe the exact evidence, wording, and useful next action.
    validations:
      required: true
  - type: textarea
    id: false_positive
    attributes:
      label: When should it stay quiet?
      description: Give at least one case that should not trigger the signal.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The example is public and contains no credentials or private repository data.
          required: true
