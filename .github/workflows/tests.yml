name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: qnode_ci_only
          POSTGRES_DB: qnode_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qnode_ci_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QNODE_TEST_POSTGRES_URL: postgresql://postgres:qnode_ci_only@127.0.0.1:5432/qnode_ci_only
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: bandit -q -r qnode_auditor -ll
      - run: pytest --cov=qnode_auditor --cov-branch --cov-report=term-missing --cov-fail-under=85

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run lint:js
