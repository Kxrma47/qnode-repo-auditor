services:
  - type: web
    name: qnode-repo-auditor
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GITHUB_APP_ID
        value: "4776373"
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_INSTALLATION_ID
        value: "157859600"
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_AUDIT_ENABLED
        value: "true"
      - key: AUDIT_CACHE_SECONDS
        value: "300"
